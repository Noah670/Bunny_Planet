<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Planet</title>
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle at top, #1c2d4f 0%, #090b14 70%); }
        canvas { display: block; touch-action: none; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: Arial, sans-serif;
            z-index: 10;
        }
        #timer {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fff;
            font-family: Arial, sans-serif;
            z-index: 10;
        }
        #planetHud {
            position: absolute;
            top: 58px;
            left: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(10, 20, 40, 0.55);
            color: #e9f5ff;
            font-family: Arial, sans-serif;
            min-width: 180px;
            box-shadow: 0 12px 22px rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        #planetName {
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        #planetList {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }
        #planetList li span {
            color: #7cffd1;
            font-weight: 600;
        }
        #controlHint {
            position: absolute;
            bottom: 190px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 0.5px;
            z-index: 12;
            transition: opacity 0.4s ease;
        }
        #startScreen, #completeScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-family: Arial, sans-serif;
            z-index: 20;
        }
        #startScreen h1 {
            font-size: 48px;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 12px 32px rgba(0,0,0,0.55);
        }
        #startButton, #restartButton, #titleButton {
            padding: 15px 30px;
            margin-top: 20px;
            background: #ff6ec7;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(0,0,0,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #startButton:hover:not(:disabled),
        #restartButton:hover,
        #titleButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px rgba(0,0,0,0.4);
        }
        #startButton:disabled {
            background: rgba(120,120,120,0.8);
            cursor: default;
            box-shadow: none;
        }
        #joystick {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            touch-action: none;
            box-shadow: 0 10px 22px rgba(0,0,0,0.35);
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        #joystick.active {
            background: rgba(255,255,255,0.18);
            box-shadow: 0 14px 26px rgba(0,0,0,0.45);
        }
        #stick {
            position: absolute;
            width: 60px;
            height: 60px;
            left: 30px;
            top: 30px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: translate(0, 0);
        }
        #loadingOverlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
            transition: opacity 0.35s ease;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loadingText {
            font-size: 18px;
            letter-spacing: 2px;
        }
        #loadingBar {
            width: 260px;
            height: 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.25);
            overflow: hidden;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.35);
        }
        #loadingBarFill {
            display: block;
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6bd5ff, #ff9dff);
            transition: width 0.25s ease;
        }
        #jumpButton, #hopButton, #tongueButton {
            position: absolute;
            bottom: 40px;
            right: 30px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,110,199,0.9);
            border: none;
            color: #fff;
            font-size: 20px;
            touch-action: none;
        }
        #hopButton { bottom: 130px; }
        #tongueButton {
            bottom: 220px;
            background: rgba(255,200,50,0.9);
        }
        @media (max-width: 720px) {
            #joystick {
                width: 140px;
                height: 140px;
                bottom: 24px;
                left: 24px;
            }
            #stick {
                width: 70px;
                height: 70px;
                left: 35px;
                top: 35px;
            }
            #jumpButton, #hopButton, #tongueButton {
                width: 90px;
                height: 90px;
                font-size: 18px;
                right: 20px;
            }
            #hopButton { bottom: 140px; }
            #tongueButton { bottom: 240px; }
            #controlHint { bottom: 210px; }
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>Bunny Planet</h1>
        <div id="loadingOverlay">
            <div id="loadingText">Loading 0%</div>
            <div id="loadingBar"><span id="loadingBarFill"></span></div>
        </div>
        <button id="startButton">Start</button>
    </div>
    <div id="completeScreen" style="display:none;">
        <h1 id="completeMessage">Planet Completed!</h1>
        <button id="restartButton">Restart</button>
        <a id="titleButton" href="start.html">Title Screen</a>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">Bunnies left: <span id="bunnyCount">0</span></div>
    <div id="timer">Time: <span id="timerVal">250</span>s</div>
    <div id="planetHud">
        <div id="planetName">Planet: --</div>
        <ul id="planetList"></ul>
    </div>
    <div id="controlHint">Drag to look · Double tap to hop · Use the stick to move</div>
    <div id="joystick"><div id="stick"></div></div>
    <button id="jumpButton">Jump</button>
    <button id="hopButton">Hop</button>
    <button id="tongueButton" style="display:none;">Tongue</button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
